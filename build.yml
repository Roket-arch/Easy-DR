name: Build Easy DR installer
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Dépendances
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Exécutable (PyInstaller)
        run: python tools/build.py
      - name: Installateur (Inno Setup)
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\easydr.iss
      - uses: actions/upload-artifact@v4
        with: { name: EasyDR-Setup, path: dist/EasyDR-Setup.exe }
      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: dist/EasyDR-Setup.exe }
